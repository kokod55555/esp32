<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็กข้อมูลนักเรียน - Google Sheets</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
        }

        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #1abc9c;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* สไตล์ของตารางข้อมูล */
        .table-responsive {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.1rem;
            color: #7f8c8d;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Student Tracker</h1>
        <nav>
            <a href="#">หน้าแรก</a>
            <a href="#">รายงาน</a>
        </nav>
    </header>

    <main class="container">
        <h2 style="text-align: center; color: #2c3e50;">รายชื่อและระยะทาง</h2>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>เวลา (Timestamp)</th>
                        <th>ชื่อ - นามสกุล</th>
                        <th>รหัสนักเรียน</th>
                        <th>ระยะทาง (Distance)</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="4" class="loading">กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Student Tracker System</p>
    </footer>

    <script>
        // 📌 ใส่ Web App URL ที่ได้จาก Google Apps Script ที่นี่
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkI2SxiLmQyqqVcyPMRp5FkvHZJFoV4nnjQc6NSY2vw2O2cSWoNoKOrqvJMODyKFc/exec';

        async function fetchStudentData() {
            const tableBody = document.getElementById('table-body');
            
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" class="loading">ไม่พบข้อมูลในระบบ</td></tr>';
                    return;
                }

                tableBody.innerHTML = ''; // เคลียร์สถานะกำลังโหลด

                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.timestamp || '-'}</td>
                        <td><strong>${item.name || '-'}</strong></td>
                        <td>${item.studentId || '-'}</td>
                        <td>${item.distance || '-'}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (error) {
                console.error('Error fetching data:', error);
                tableBody.innerHTML = '<tr><td colspan="4" class="loading" style="color: red;">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
            }
        }

        fetchStudentData();
    </script>
</body>
</html>
